<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Idílica">
  <rect width="512" height="512" rx="112" fill="#9D2C34"/>
  <!-- Isotipo Idílica: espiral de capas (hojaldre laminado), crema sobre burgundy.
       Elipses concéntricas con el "ojo" descentrado para evocar la masa enrollada. -->
  <g fill="none" stroke="#EEE7D2" stroke-width="11" stroke-linecap="round">
    <ellipse cx="256" cy="264" rx="150" ry="126" transform="rotate(-12 256 264)"/>
    <ellipse cx="250" cy="256" rx="119" ry="99" transform="rotate(-12 250 256)"/>
    <ellipse cx="245" cy="249" rx="90" ry="74" transform="rotate(-12 245 249)"/>
    <ellipse cx="241" cy="243" rx="62" ry="50" transform="rotate(-12 241 243)"/>
    <ellipse cx="238" cy="238" rx="35" ry="28" transform="rotate(-12 238 238)"/>
  </g>
  <circle cx="236" cy="234" r="9" fill="#EEE7D2"/>
</svg>
