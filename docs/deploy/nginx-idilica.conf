# nginx — PWA Idílica en idilica.joelbarranco.io
# Sirve /home/ellebkey/apps/idilica/dist (lo que sube el workflow) y proxya
# /api al backend Go en :8101 → misma-origin, igual que el proxy de Vite en
# dev: sin CORS y sin VITE_API_URL en el build.
#
# Instalación (una vez):
#   sudo cp nginx-idilica.conf /etc/nginx/sites-available/idilica
#   sudo ln -s /etc/nginx/sites-available/idilica /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d idilica.joelbarranco.io
server {
    listen 80;
    server_name idilica.joelbarranco.io;

    root /home/ellebkey/apps/idilica/dist;
    index index.html;

    # API misma-origin → Go
    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El service worker y el manifest NUNCA se cachean agresivo
    # (si no, la PWA instalada no se entera de las versiones nuevas)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre: cache inmutable de un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta cae al index (react-router se encarga)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
